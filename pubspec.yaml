name: flutter_riverpod_template
description: "Feature-First Flutter + Riverpod template."
publish_to: 'none' 

version: 1.1.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  freezed_annotation: ^3.1.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  dio: ^5.10.0
  go_router: ^17.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  permission_handler: ^13.0.1
  flutter_secure_storage: ^11.0.0
  talker: ^5.1.20
  talker_dio_logger: ^5.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_lint: ^3.1.8
  go_router_builder: ^4.4.0
  pigeon: ^28.0.0

flutter:
  generate: true
  uses-material-design: true
